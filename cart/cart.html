<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>
<link rel="stylesheet" href="cart.css">
</head>
<body>

<header>
    <h1>🛒 My Shopping Cart</h1>
</header>

<div class="container">

    <div class="cart-item">

        <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400">

        <div class="details">

            <h2>Travel Guide Book</h2>

            <p>Price : ₹799</p>

            <p>Quantity : 1</p>

            <button>Remove</button>

        </div>

    </div>

    <div class="cart-item">

        <img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=400">

        <div class="details">

            <h2>World Map</h2>

            <p>Price : ₹499</p>

            <p>Quantity : 1</p>

            <button>Remove</button>

        </div>

    </div>

    <div class="summary">

        <h2>Order Summary</h2>

        <p>Items : 2</p>

        <p>Total : ₹1298</p>

        <button class="checkout">Checkout</button>

    </div>

</div>

</body>
</html>
