<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="singup.css">
</head>
<body>

<div class="container">

    <div class="signup-box">

        <h1>Sign Up</h1>
        <p>Create your account to get started</p>
        <label>Full Name</label>
        <div class="input-box">
            <i class="bi bi-person"></i>
            <input type="text" id="fristname" placeholder="Enter your full name">
        </div>
        <label>Email Address</label>
        <div class="input-box">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" placeholder="Enter your email address">
        </div>
        <label>Password</label>
        <div class="input-box">
            <i class="bi bi-lock"></i>
            <input
            type="password"
            id="password"
            placeholder="Create a password">
            <i
            class="bi bi-eye-slash eye"
            onclick="togglePassword('password',this)">
            </i>
        </div>
        <label>Confirm Password</label>
        <div class="input-box">
            <i class="bi bi-lock"></i>
            <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password">
            <i
            class="bi bi-eye-slash eye"
            onclick="togglePassword('confirm',this)">
            </i>
        </div>
        <div class="check">
            <input type="checkbox" id="check"
            onclick="showAllPassword()">
            <span class="showpassword">Show Password</span>

        </div>
        <div class="captcha">
            <input type="checkbox" id="checkbox">
            <span>I'm not a robot</span>
            <img
            src="https://www.gstatic.com/recaptcha/api2/logo_48.png">
        </div>
        <div class="check">
            <input type="checkbox" id="checkbox1">
            <span>I agree to the
               <div class="termsand"><a href="#">Terms & Conditions</a></div> 
            </span>
        </div>
        <div class="check">
            <input type="checkbox" id="checkbox2">
            <span>I agree to the
              <div class="privacy2"> <a href="#">Privacy Policy</a></div> 
            </span>
        </div>
        <button class="signup-btn">
            Sign Up
        </button>
        <div class="divider">
            <hr>
            <span>or</span>
            <hr>
        </div>
        <button class="social google">
            <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
            Continue with Google
        </button>
        <button class="social facebook">
            <img
            src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
            Continue with Facebook
        </button>
        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>
    </div>
</div>





<script src="signup.js"></script>

</body>
</html>
